version: '3.8'

services:
  # Backend API Service
  backend:
    build: .
    container_name: rjw_fx_backend
    ports:
      - "4000:4000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://forex_user:forex_password@db:5432/forex_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-rjw_global_fx_jwt_secret}
      - SECRET_KEY=${SECRET_KEY:-rjw_global_fx_secret_key}
    depends_on:
      - db
      - redis
    volumes:
      - ./logs:/app/logs
      - ./instance:/app/instance
    restart: unless-stopped
    networks:
      - forex_network

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: rjw_fx_db
    environment:
      - POSTGRES_DB=forex_db
      - POSTGRES_USER=forex_user
      - POSTGRES_PASSWORD=forex_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - forex_network

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: rjw_fx_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - forex_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: rjw_fx_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - forex_network

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: rjw_fx_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped
    networks:
      - forex_network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: rjw_fx_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - forex_network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  forex_network:
    driver: bridge
